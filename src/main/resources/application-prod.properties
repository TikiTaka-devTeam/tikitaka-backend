spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600}

app.aws.s3.bucket=${AWS_S3_BUCKET}
app.aws.s3.region=${AWS_REGION:ap-northeast-2}
app.aws.s3.cloudfront-domain=${CLOUDFRONT_DOMAIN}
app.aws.s3.profile-prefix=${AWS_S3_PROFILE_PREFIX:files/profiles}
app.aws.s3.presigned-url-expiration-minutes=${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:10}
app.aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
app.aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
